summary: >
  AI/ML-focused software engineer with an MSc (Honors) in Software Engineering from ITMO University and
  a BSc in Information Technology from Tartous University, Syria. I specialize in applying machine learning to practical,
  real-world applications, with a strong foundation in modern web and mobile development.
  My technical foundation spans Python, JavaScript, TypeScript, React, and React Native,
  complemented by strong fundamentals in object-oriented programming, version control,
  and software testing. I build user-centric web and mobile applications, with a focus on
  bringing machine learning capabilities directly into the browser for fast, private, on-device experiences.
  I'm passionate about writing clean, performant code and applying ML in practical,
  deployable ways — whether that's a responsive web app, a cross-platform mobile experience,
  or an ML-powered feature running entirely client-side.

