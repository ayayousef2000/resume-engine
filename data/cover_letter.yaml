body_paragraphs:
  - "I am writing to apply for the Digital, AI and Innovation Internship with UNDP's DAI Hub, with particular interest in the Product Design, Build and Management and Data Policy & Governance workstreams. I hold an MSc (Honours, Red Diploma) in Web Technologies from ITMO University, completed in July 2026, and a BSc in Information Technology from Tartous University, with a focus on applying machine learning to practical, deployable products."
  - "For my Master's thesis, I built a full-stack multilingual (English, Arabic, Russian) sentiment analysis system running entirely in the browser: fine-tuning DistilBERT, converting it to ONNX with INT8 quantization (75% size reduction), and implementing in-browser inference with WebGPU/WASM fallback, achieving 94.91ms latency and 0.72 F1-macro. I later integrated this model into a live company website as a Freelance AI/ML Engineer, designing it to retain only sentiment summaries rather than full review text to protect customer data — work formally recognized via a signed Act of Implementation in June 2026."
  - "This AI/ML grounding sits alongside full-stack development experience — Python, JavaScript/TypeScript, React, React Native, Flutter, and Node.js — and comfort working independently on ambiguous, cross-functional problems."
  - "I am drawn to this internship because it treats digital and AI capability as infrastructure for development outcomes, and I would welcome the chance to contribute that approach to the DAI Hub. I am submitting through both the UNDP Careers portal and the Airtable form, and would be glad to provide further information."

closing: "Sincerely,"
